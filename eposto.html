<html lang="pt-BR"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f4;--card:#fff;--ink:#0d1f1a;--mut:#5f736b;--line:#dbe5e0;--ac:#0ea968;--acd:#fff;--livre:#0ea968;--res:#e59a0c;--uso:#2f6fe0;--off:#8a9892;--bad:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 'Space Grotesk',system-ui,sans-serif;min-height:100%}

label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.btn{border:0;background:var(--ac);color:var(--acd);font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;cursor:pointer}
.btn.s{background:none;border:1px solid var(--line);color:var(--ink);font-weight:500;padding:6px 12px}
.btn.d{background:var(--bad);color:#fff}.btn.w{width:100%;margin-top:12px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.livre{background:var(--livre)}.reservado,.pendente{background:var(--res)}.em-uso,.ativa{background:var(--uso)}.indisponivel,.cancelada,.cancelado{background:var(--off)}.pago,.concluida,.encerrada{background:var(--livre)}

.login{max-width:380px;margin:6vh auto}.login h1{font-size:34px;margin:0}.login h1 span{color:var(--ac)}
.demo{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pcard{display:flex;gap:12px;cursor:pointer;align-items:stretch}.pimg{flex:0 0 118px}.pimg svg{width:100%;height:auto;border-radius:10px;display:block}.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.mapbox{position:relative;padding:0;overflow:hidden}.mapbox svg{display:block;width:100%;height:auto;touch-action:none;cursor:grab}.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}.mapctl button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 16px 'Space Grotesk',system-ui,sans-serif;cursor:pointer}.num{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:99px;background:var(--ac);color:var(--acd);font-weight:700;font-size:12px;margin-right:6px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 16px;font:inherit;cursor:pointer}.chip.on{border-color:var(--ac);background:var(--ac);color:var(--acd);font-weight:700}.chip.cal{display:inline-flex;align-items:center;gap:6px;position:relative;margin:0;font-size:15px}.chip.cal input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;cursor:pointer}

.ccard{border-radius:14px;padding:12px 14px;color:#fff;font-size:13px;min-height:88px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}.cb{font-weight:700;letter-spacing:.5px}.cn{font-size:15px;letter-spacing:2px}.cm{display:flex;justify-content:space-between;opacity:.9;font-size:12px}

<div id="app"></div><div id="toast"></div>
<script>
const TARIFA=1.89, DUR=2*3600e3, H=3600e3;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=n=>'R$ '+Number(n).toFixed(2).replace('.',','), D=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const uid=()=>Math.random().toString(36).slice(2,8);
function seed(){const n=Date.now(),d=24*H,U=(id,nome,email,perfil,x)=>({id,nome,email,tel:'(92) 9'+id.slice(1).padStart(4,'0')+'-0000',senha:'123',perfil,ativo:true,...x});const G=(()=>{const s=[],p=[],r=[];for(let i=0;i<40;i++){const cid='C'+(1+(i*5)%14),u=i%2?'u13':'u14',ini=n-(i%29)*d-((i*3)%9+9)*H,kwh=10+(i*7)%36,v=+(kwh*TARIFA).toFixed(2);s.push({id:'sg'+i,cid,uid:u,vid:null,ini,fim:ini+H,kwh,valor:v,status:'encerrada'});p.push({id:'pg'+i,sid:'sg'+i,valor:v,forma:i%3?'PIX':'Visa •••• 4242',status:i%9==0?'pendente':'pago',pagoEm:ini+2*H});r.push({id:'rg'+i,uid:u,vid:null,cid,inicio:ini-H,status:i%7==0?'cancelada':'concluida'})}return{s,p,r}})();return{postos:[{id:'p1',nome:'Amazon Volt Centro',end:'Av. Eduardo Ribeiro, 520 – Centro, Manaus/AM',dono:'Amazon Volt',cor:'#0ea968',lat:-3.1325,lng:-60.0230},{id:'p2',nome:'Rio Negro Carga Adrianópolis',end:'Rua Rio Içá, 300 – Adrianópolis, Manaus/AM',dono:'Rio Negro Energia',cor:'#2f6fe0',lat:-3.1010,lng:-60.0150},{id:'p3',nome:'EletroNorte Chapada',end:'Av. Djalma Batista, 1661 – Chapada, Manaus/AM',dono:'EletroNorte',cor:'#e59a0c',lat:-3.0905,lng:-60.0215},{id:'p4',nome:'EletroNorte Cachoeirinha',end:'Av. Ayrão, 1100 – Cachoeirinha, Manaus/AM',dono:'EletroNorte',cor:'#e59a0c',lat:-3.1215,lng:-60.0090},{id:'p5',nome:'Boto Charge Aleixo',end:'Av. André Araújo, 2000 – Aleixo, Manaus/AM',dono:'Boto Charge',cor:'#7c5cd6',lat:-3.0840,lng:-59.9960},{id:'p6',nome:'Boto Charge Flores',end:'Av. Rodrigo Otávio, 3555 – Flores, Manaus/AM',dono:'Boto Charge',cor:'#7c5cd6',lat:-3.0870,lng:-60.0060}],
 users:[{id:'u1',nome:'Ana Admin',email:'admin@eposto.com',tel:'(85) 90000-0001',senha:'123',perfil:'administrador',ativo:true},
 {id:'u2',nome:'Otávio Operador',email:'operador@eposto.com',tel:'(85) 90000-0002',senha:'123',perfil:'operador',postoId:'p1',ativo:true},
 {id:'u3',nome:'Gabi Gestora',email:'gestor@eposto.com',tel:'(85) 90000-0003',senha:'123',perfil:'gestor',postoIds:['p1'],ativo:true},
 {id:'u4',nome:'Marco Souza',email:'marco@email.com',tel:'(85) 90000-0004',senha:'123',perfil:'cliente',ativo:true}].concat([U('u5','Carla Gestora','gestor2@eposto.com','gestor',{postoIds:['p2']}),U('u6','Rafael Operador','operador2@eposto.com','operador',{postoId:'p2'}),U('u7','Paulo Gestor','gestor3@eposto.com','gestor',{postoIds:['p3','p4']}),U('u8','Lia Operadora','operador3@eposto.com','operador',{postoId:'p3'}),U('u9','Davi Operador','operador4@eposto.com','operador',{postoId:'p4'}),U('u10','Marta Gestora','gestor4@eposto.com','gestor',{postoIds:['p5','p6']}),U('u11','Iago Operador','operador5@eposto.com','operador',{postoId:'p5'}),U('u12','Bia Operadora','operador6@eposto.com','operador',{postoId:'p6'}),U('u13','Júlia Ramos','julia@email.com','cliente',{}),U('u14','Pedro Lima','pedro@email.com','cliente',{})]),
 veiculos:[{id:'v1',uid:'u4',marca:'BYD',modelo:'Dolphin',ano:2024,placa:'ABC1D23',conector:'CCS2',carroc:'Hatch',bateria:60},{id:'v2',uid:'u4',marca:'Nissan',modelo:'Leaf',ano:2019,placa:'DEF4G56',conector:'CHAdeMO',carroc:'Hatch',bateria:40},{id:'v3',uid:'u4',marca:'Volvo',modelo:'EX30',ano:2025,placa:'GHI7J89',conector:'CCS2',carroc:'SUV',bateria:69}],
 carregadores:[{id:'C1',pid:'p1',nome:'Carregador 1',potencia:22,conector:'Tipo 2',base:'livre'},{id:'C2',pid:'p1',nome:'Carregador 2',potencia:50,conector:'CCS2',base:'livre'},{id:'C3',pid:'p2',nome:'Carregador 1',potencia:120,conector:'CCS2',base:'livre'},{id:'C4',pid:'p2',nome:'Carregador 2',potencia:50,conector:'CCS2',base:'indisponivel'},{id:'C5',pid:'p2',nome:'Carregador 3',potencia:22,conector:'Tipo 2',base:'livre'},{id:'C6',pid:'p3',nome:'Carregador 1',potencia:50,conector:'CCS2',base:'livre'},{id:'C7',pid:'p3',nome:'Carregador 2',potencia:50,conector:'CHAdeMO',base:'livre'},{id:'C8',pid:'p3',nome:'Carregador 3',potencia:22,conector:'Tipo 2',base:'livre'},{id:'C9',pid:'p4',nome:'Carregador 1',potencia:22,conector:'Tipo 2',base:'livre'},{id:'C10',pid:'p4',nome:'Carregador 2',potencia:120,conector:'CCS2',base:'livre'},{id:'C11',pid:'p5',nome:'Carregador 1',potencia:50,conector:'CCS2',base:'livre'},{id:'C12',pid:'p5',nome:'Carregador 2',potencia:22,conector:'Tipo 2',base:'livre'},{id:'C13',pid:'p6',nome:'Carregador 1',potencia:120,conector:'CCS2',base:'livre'},{id:'C14',pid:'p6',nome:'Carregador 2',potencia:50,conector:'CHAdeMO',base:'livre'}],
 reservas:[{id:'r0',uid:'u4',vid:'v1',cid:'C2',inicio:n-2*d,status:'concluida'},{id:'r00',uid:'u4',vid:'v1',cid:'C3',inicio:n-d,status:'cancelada'}].concat(G.r),
 sessoes:[{id:'s1',cid:'C2',uid:'u4',vid:'v1',ini:n-2*d,fim:n-2*d+1.5*H,kwh:32,valor:32*TARIFA,status:'encerrada'},{id:'s2',cid:'C3',uid:'u4',vid:'v1',ini:n-5*d,fim:n-5*d+H,kwh:45,valor:45*TARIFA,status:'encerrada'},{id:'s3',cid:'C1',uid:'u4',vid:'v1',ini:n-4*H,fim:n-2*H,kwh:18,valor:18*TARIFA,status:'encerrada'}].concat(G.s),
 pagamentos:[{id:'p1',sid:'s1',valor:32*TARIFA,forma:'PIX',status:'pago'},{id:'p2',sid:'s2',valor:45*TARIFA,forma:'Cartão',status:'pago'},{id:'p3',sid:'s3',valor:18*TARIFA,forma:'',status:'pendente'}].concat(G.p),
 cartoes:[{id:'k1',uid:'u4',bandeira:'Visa',final:'4242',val:'12/28',titular:'MARCO SOUZA'},{id:'k2',uid:'u4',bandeira:'Mastercard',final:'0002',val:'08/27',titular:'MARCO SOUZA'}]}}
let db;try{db=JSON.parse(localStorage.getItem('eposto6'))}catch(e){}db=db||seed();
const save=()=>{try{localStorage.setItem('eposto6',JSON.stringify(db))}catch(e){}};
let me=null,tab='',view={ap:{}},toastT,loc=null,mp=null;
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',3200)};
const by=(a,id)=>db[a].find(x=>x.id===id);
const sessAtiva=c=>db.sessoes.find(s=>s.cid===c&&s.status==='ativa');
const resAgora=(c,n=Date.now())=>db.reservas.find(r=>r.cid===c&&r.status==='ativa'&&r.inicio<=n&&n<r.inicio+DUR);
function st(c){if(c.base==='indisponivel')return'indisponivel';if(sessAtiva(c.id))return'em-uso';if(resAgora(c.id))return'reservado';return'livre'}
const lbl=s=>({'em-uso':'em uso',indisponivel:'indisponível'}[s]||s);
const tag=s=>`<span class="tag ${s}">${lbl(s)}</span>`;
const TABS={cliente:[['disp','Disponibilidade'],['res','Reservar'],['mres','Minhas reservas'],['veic','Veículos'],['hist','Histórico'],['cart','Cartões']],
 operador:[['painel','Painel'],['sess','Sessões']],gestor:[['rel','Relatórios']],
 administrador:[['painel','Painel'],['sess','Sessões'],['rel','Relatórios'],['users','Usuários']]};

/* ---------- Auth ---------- */
function loginView(){return`<div class="login"><h1>E-<span>Posto</span></h1><p class="mut">Gestão de eletroposto · protótipo</p>
<div class="card"><label>E-mail</label><input id="le" type="email"><label>Senha</label><input id="ls" type="password">
<button class="btn w" onclick="login($('#le').value,$('#ls').value)">Entrar</button>
<button class="btn s w" onclick="view.cad=1;draw()">Criar conta de cliente</button>
<div class="mut" style="margin-top:12px">Acesso rápido (demo):</div><div class="demo">
${['marco@email.com:Cliente','operador@eposto.com:Operador','gestor@eposto.com:Gestor','admin@eposto.com:Admin'].map(x=>{const[e,n]=x.split(':');return`<button class="btn s" onclick="login('${e}','123')">${n}</button>`}).join('')}</div></div></div>`}
function cadView(){return`<div class="login"><h1>Criar conta</h1><div class="card">
<label>Nome</label><input id="cn"><label>E-mail</label><input id="ce" type="email"><label>Telefone</label><input id="ct"><label>Senha</label><input id="cs" type="password">
<button class="btn w" onclick="cadastrar()">Cadastrar</button><button class="btn s w" onclick="view.cad=0;draw()">Voltar</button></div></div>`}
function cadastrar(){const n=$('#cn').value.trim(),e=$('#ce').value.trim().toLowerCase(),t=$('#ct').value.trim(),s=$('#cs').value;
 if(!n||!e||!t||!s)return toast('Preencha todos os campos.');if(!/^\S+@\S+\.\S+$/.test(e))return toast('E-mail inválido.');
 if(db.users.some(u=>u.email===e))return toast('Já existe uma conta com este e-mail.');
 db.users.push({id:uid(),nome:n,email:e,tel:t,senha:s,perfil:'cliente',ativo:true});save();view.cad=0;draw();toast('Cadastro realizado! Faça login.')}
function login(e,s){const u=db.users.find(x=>x.email===e.trim().toLowerCase()&&x.senha===s);
 if(!u)return toast('E-mail ou senha inválidos.');if(!u.ativo)return toast('Conta desativada. Procure o administrador.');
 me=u;tab=TABS[u.perfil][0][0];draw()}
const logout=()=>{me=null;draw()};
const can=(...p)=>p.includes(me.perfil);

/* ---------- Telas ---------- */
const screens={
disp(){
 if(!loc)return`<h2>Eletropostos próximos</h2><div class="card mut">Obtendo sua localização…</div>`;
 const L=nearby(),src=loc.src==='gps'?'📍 Sua localização atual':'📍 Localização de exemplo: Centro de Manaus';
 return`<h2>Eletropostos próximos</h2><div class="row" style="margin-bottom:8px"><span class="mut">${src} · raio de 7 km</span>${loc.src==='gps'?`<button class="btn s" onclick="setLoc(DEF,'exemplo')">Usar Centro de Manaus (exemplo)</button>`:`<button class="btn s" onclick="pedeLoc()">Usar minha localização</button>`}</div>
 <div class="card mapbox"><svg id="mapsvg" viewBox="0 0 360 280" role="img" aria-label="Mapa com sua localização e os eletropostos num raio de 7 km"></svg><div class="mapctl"><button onclick="zoom(1.3)" aria-label="Aproximar">+</button><button onclick="zoom(1/1.3)" aria-label="Afastar">−</button><button onclick="recentra()" aria-label="Centralizar">◎</button></div></div>
 ${L.length?L.map((p,i)=>pcard(p,i)).join(''):`<div class="card">Nenhum eletroposto em até 7 km da sua localização.<button class="btn w" onclick="setLoc(DEF,'exemplo')">Usar Centro de Manaus (exemplo)</button></div>`}
 <p class="mut">Toque em um eletroposto para abrir a reserva. Endereços, imagens e proprietários são fictícios.</p>`},
res(){const vs=db.veiculos.filter(v=>v.uid===me.id);
 if(!vs.length)return`<div class="card">Cadastre um veículo antes de reservar.<br><button class="btn w" onclick="go('veic')">Cadastrar veículo</button></div>`;
 const f=view.f||(view.f={}),hoje=isoOff(0),amanha=isoOff(1);
 if(!f.v||!by('veiculos',f.v))f.v=vs[0].id;if(!f.p)f.p=view.rp||db.postos[0].id;if(!f.d||f.d<hoje)f.d=hoje;if(f.b0==null){f.b0=20;f.b1=80}
 const p=by('postos',f.p),v=by('veiculos',f.v),cs=db.carregadores.filter(c=>c.pid===p.id),ac=COMPAT[v.conector]||[v.conector];
 if(!cs.some(c=>c.id===f.c&&okConn(v,c)&&c.base!=='indisponivel'))f.c=(cs.find(c=>c.base!=='indisponivel'&&okConn(v,c))||{}).id||null;
 const c=f.c?by('carregadores',f.c):null,hrs=[...Array(17)].map((_,i)=>i+6);
 if(!hrs.includes(f.h)||!livreH(f,c,f.h))f.h=hrs.find(h=>livreH(f,c,h))??null;
 const outra=f.d!==hoje&&f.d!==amanha;
 return`<h2>Nova reserva</h2>
<div class="card"><label style="margin-top:0">Eletroposto</label><input id="rq" type="search" placeholder="Buscar eletroposto por nome ou endereço" value="${esc(view.rq||'')}" oninput="view.rq=this.value;rList()" aria-label="Buscar eletroposto"><div id="rlist">${rInner(f)}</div>
<div class="pcard" style="margin-top:10px;cursor:default"><div class="pimg">${postoImg(p)}</div><div class="pinfo"><b>${esc(p.nome)}</b><div class="mut">📍 ${esc(p.end)}</div><div class="mut">Proprietário: ${esc(p.dono)}</div></div></div></div>
<div class="card"><b>1 · Veículo</b><div class="vrow" style="margin-top:8px">${vs.map(x=>`<div class="opt ${x.id===f.v?'on':''}" onclick="view.f.v='${x.id}';draw()"><div class="vimg">${vImg(x)}</div><b>${esc(x.marca)} ${esc(x.modelo)}</b><div class="mut">${esc(x.placa)} · ${x.bateria} kWh</div><div class="cic">${connIcon(x.conector,20)}${esc(x.conector)}</div></div>`).join('')}</div>
<div class="row" style="justify-content:flex-start;gap:12px;margin-top:10px"><span class="mut">Aceita:</span>${ac.map(t=>`<span class="cic">${connIcon(t,22)}${t} (${t==='Tipo 2'?'AC':'DC'})</span>`).join('')}</div></div>

 return`<svg viewBox="0 0 240 150" role="img" aria-label="Ilustração do eletroposto ${esc(p.nome)}"><rect width="240" height="150" fill="#cfe8f6"/><circle cx="205" cy="24" r="13" fill="#ffd66b"/><path d="M0 100h240v50H0z" fill="#4b5a55"/><path d="M0 132h240" stroke="#f2f6f4" stroke-width="2" stroke-dasharray="14 10"/><rect x="26" y="34" width="188" height="16" rx="4" fill="${k}"/><rect x="26" y="29" width="188" height="6" rx="2" fill="#1d3557"/><path d="M122 36l-7 9h6l-4 8 10-11h-6z" fill="#fff"/><rect x="38" y="50" width="6" height="68" fill="#e8eeeb"/><rect x="196" y="50" width="6" height="68" fill="#e8eeeb"/>${st}<path d="M142 98c-10 12-14 6-20 8" stroke="${k}" stroke-width="2" fill="none"/><path d="M52 112h66a6 6 0 0 0 6-6v-6a6 6 0 0 0-6-6l-10-1-8-9H78l-8 9-12 1a6 6 0 0 0-6 6v6a6 6 0 0 0 6 6z" fill="${car}" stroke="#0d1f1a" stroke-width="1.2"/><circle cx="70" cy="113" r="7" fill="#0d1f1a"/><circle cx="104" cy="113" r="7" fill="#0d1f1a"/></svg>`}
function pcard(p,i){const cs=db.carregadores.filter(c=>c.pid===p.id),liv=cs.filter(c=>st(c)==='livre').length,tp={};cs.forEach(c=>tp[c.conector]=(tp[c.conector]||0)+1);
 return`<div class="card pcard" onclick="abrirReserva('${p.id}')"><div class="pimg">${postoImg(p)}</div><div class="pinfo"><b><span class="num">${i+1}</span>${esc(p.nome)}</b><div class="mut">📍 ${esc(p.end)}</div><div style="font-size:13px"><b>${p.km.toFixed(1).replace('.',',')} km</b> · ${cs.length} carregadores</div><div class="row" style="justify-content:flex-start;gap:10px">${Object.entries(tp).map(([k,n])=>`<span class="cic">${connIcon(k,18)}${n}× ${k}</span>`).join('')}</div><div><span class="tag ${liv?'livre':'indisponivel'}">${liv} livre${liv===1?'':'s'}</span> <span class="mut">Proprietário: ${esc(p.dono)}</span></div></div></div>`}
const go=t=>{tab=t;draw()};

/* ---------- Ações ---------- */
function reservar(){const f=view.f,c=f.c?by('carregadores',f.c):null,v=by('veiculos',f.v);
 if(!c)return toast('Escolha um carregador compatível.');if(f.h==null)return toast('Escolha um horário.');
 const ini=new Date(f.d+'T'+pad2(f.h)+':00:00').getTime();
 if(ini<=Date.now())return toast('Horário inválido: escolha um horário futuro.');
 if(c.base==='indisponivel')return toast('Carregador indisponível não pode ser reservado.');
 if(!okConn(v,c))return toast('O conector deste carregador é incompatível com o veículo.');
 if(db.reservas.some(r=>r.cid===c.id&&r.status==='ativa'&&ini<r.inicio+DUR&&r.inicio<ini+DUR))return toast('Carregador já reservado neste período.');
 db.reservas.push({id:uid(),uid:me.id,vid:f.v,cid:c.id,inicio:ini,status:'ativa'});save();toast(`Reserva confirmada: ${c.nome}, ${D(ini)} (2h).`);go('mres')}
function cancelar(id){const r=by('reservas',id);if(r.inicio-Date.now()<H)return toast('Cancelamento só é permitido com mais de 1h de antecedência.');
 if(!confirm('Cancelar esta reserva?'))return;r.status='cancelada';save();draw();toast('Reserva cancelada e horário liberado.')}
function addVeic(){const v={id:uid(),uid:me.id,marca:$('#vm').value.trim(),modelo:$('#vo').value.trim(),ano:+$('#va').value,placa:$('#vp').value.trim().toUpperCase(),conector:$('#vc').value,carroc:$('#vk').value,bateria:+$('#vb').value};
 if(!v.marca||!v.modelo||!v.ano||!v.placa||!(v.bateria>0))return toast('Preencha todos os campos corretamente.');db.veiculos.push(v);save();draw();toast('Veículo cadastrado.')}
function togStatus(id){const c=by('carregadores',id);if(!podeOp(c))return toast(MSG);if(sessAtiva(id))return toast('Há sessão em andamento neste carregador.');c.base=c.base==='indisponivel'?'livre':'indisponivel';save();draw();toast(`${cnm(id)} agora está ${lbl(c.base)}.`)}
function addCarr(){const nome=$('#nc').value.trim(),pid=$('#npo').value,p=+$('#np').value;if(!nome||!(p>0))return toast('Informe o nome e a potência.');
 if(db.carregadores.some(c=>c.pid===pid&&c.nome.toLowerCase()===nome.toLowerCase()))return toast('Já existe um carregador com este nome neste eletroposto.');
 const n=Math.max(0,...db.carregadores.map(c=>+c.id.slice(1)||0))+1;db.carregadores.push({id:'C'+n,pid,nome,potencia:p,conector:$('#nt').value,base:'livre'});save();draw();toast('Carregador criado com ID C'+n+'.')}
function iniciar(cid){if(!podeOp(by('carregadores',cid)))return toast(MSG);const cl=db.users.filter(u=>u.perfil==='cliente'&&u.ativo),r=resAgora(cid);
 view.ini=cid;const el=document.createElement('div');el.id='modal';el.style.cssText='position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px';
 el.innerHTML=`<div class="card" style="width:100%;max-width:360px"><b>Iniciar sessão em ${esc(cnm(cid))}</b>${r?`<p class="mut">Reservado por ${esc(by('users',r.uid).nome)} neste horário.</p>`:''}
 <label>Cliente</label><select id="mc" onchange="fillV()">${cl.map(u=>`<option value="${u.id}" ${r&&r.uid===u.id?'selected':''}>${esc(u.nome)}</option>`).join('')}</select><label>Veículo</label><select id="mv"></select>
 <button class="btn w" onclick="confirmaIni()">Iniciar</button><button class="btn s w" onclick="$('#modal').remove()">Fechar</button></div>`;document.body.append(el);fillV()}
function fillV(){$('#mv').innerHTML=db.veiculos.filter(v=>v.uid===$('#mc').value).map(v=>`<option value="${v.id}">${esc(vn(v.id))}</option>`).join('')}
function confirmaIni(){const cid=view.ini,u=$('#mc').value,v=$('#mv').value,c=by('carregadores',cid),r=resAgora(cid);
 if(!v)return toast('Cliente sem veículo cadastrado.');if(c.base==='indisponivel')return toast('Carregador indisponível.');if(sessAtiva(cid))return toast('Já existe sessão neste carregador.');
 if(r&&r.uid!==u)return toast('Carregador reservado para outro cliente neste horário.');
 if(r)r.status='concluida';db.sessoes.push({id:uid(),cid,uid:u,vid:v,ini:Date.now(),fim:null,kwh:null,valor:null,status:'ativa'});save();$('#modal').remove();draw();toast('Sessão iniciada.')}
function encerrar(id){const s=by('sessoes',id);if(!podeOp(by('carregadores',s.cid)))return toast(MSG);const k=parseFloat($('#k'+id).value);if(!(k>=0)||isNaN(k))return toast('Informe um consumo válido (kWh).');
 s.fim=Date.now();s.kwh=k;s.valor=+(k*TARIFA).toFixed(2);s.status='encerrada';db.pagamentos.push({id:uid(),sid:id,valor:s.valor,forma:'',status:'pendente'});save();draw();toast(`Sessão encerrada. Total: ${R(s.valor)} (pagamento pendente).`)}
function pagar(id,forma){const p=by('pagamentos',id);p.forma=forma;
 if(forma==='Cartão'&&Math.random()<.3){save();draw();return toast('Cartão recusado (simulado). Pagamento segue pendente.')}
 p.status='pago';save();draw();toast(`Pagamento de ${R(p.valor)} confirmado via ${forma}.`)}
function togUser(id){const u=by('users',id);u.ativo=!u.ativo;save();draw()}
function addFunc(){const n=$('#fn').value.trim(),e=$('#fe').value.trim().toLowerCase(),s=$('#fs').value;if(!n||!e||!s)return toast('Preencha todos os campos.');
 if(db.users.some(u=>u.email===e))return toast('E-mail já cadastrado.');if(['operador','gestor'].includes($('#fp').value)&&!$('#fpo').value)return toast('Operador e gestor precisam estar vinculados a um eletroposto.');db.users.push({id:uid(),nome:n,email:e,tel:'',senha:s,perfil:$('#fp').value,postoId:$('#fp').value==='operador'?$('#fpo').value:null,postoIds:$('#fp').value==='gestor'?[$('#fpo').value]:undefined,ativo:true});save();draw();toast('Funcionário criado.')}

function draw(){const a=$('#app');
 if(!me){a.innerHTML=view.cad?cadView():loginView();return}
 a.innerHTML=`<header><b>E-<span>Posto</span></b><div><small>${esc(me.nome)} · ${me.perfil}</small><button class="btn s" style="color:#fff;border-color:#fff4" onclick="logout()">Sair</button></div></header>
 <nav>${TABS[me.perfil].map(([k,n])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${n}</button>`).join('')}</nav><main>${screens[tab]()}</main>`;if(tab==='disp')mapInit()}
pedeLoc();draw();
</script></body></html>
